name = "anxincha-report-api"
main = "worker/index.ts"
compatibility_date = "2026-11-12"

[vars]
ALLOWED_ORIGIN = "https://donna66783-hash.github.io"

[[d1_databases]]
binding = "DB"
database_name = "anxincha-reports"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "anxincha-report-files"

