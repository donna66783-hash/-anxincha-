name: Update data and deploy website

on:
  push:
    branches:
      - main
      - master
  schedule:
    # 每天台灣時間 11:20 執行（GitHub Actions 使用 UTC）
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: threat-database-update
  cancel-in-progress: false

jobs:
  update:
    name: Download, verify, and publish data
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Download government open data
        if: github.event_name != 'push'
        run: npm run data:update

      - name: Verify database integrity
        run: npm run data:verify

      - name: Run application tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Detect database changes
        if: github.event_name != 'push'
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- public/data/threat-intelligence.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated database
        if: github.event_name != 'push' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/threat-intelligence.json
          git commit -m "data: update threat intelligence database $(date -u +'%Y-%m-%d')"
          git push

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
